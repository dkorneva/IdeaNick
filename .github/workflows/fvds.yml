name: Deploy to FirstVDS

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            dkorneva/ideanick-image:latest
            dkorneva/ideanick-image:${{ github.sha }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SOURCE_VERSION=${{ github.sha }}

      - name: Deploy on FirstVDS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.FVDS_HOST }}
          username: ${{ secrets.FVDS_USER }}
          key: ${{ secrets.FVDS_SSH_KEY }}
          port: ${{ secrets.FVDS_SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.FVDS_APP_DIR }}
            docker compose pull app
            docker compose up -d --no-build app
            docker image prune -f
